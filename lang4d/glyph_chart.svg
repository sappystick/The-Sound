<text x="350" y="646" font-size="15" fill="#222"><tspan font-weight="bold">h</tspan> breath</text>
<text x="494" y="514" font-size="12" fill="#888">row tone x9</text>
<text x="494" y="558" font-size="12" fill="#888">row tone x11</text>
<text x="494" y="602" font-size="12" fill="#888">row tone x13</text>
<text x="494" y="646" font-size="12" fill="#888">row tone x15</text>
<text x="50" y="678" font-size="12" fill="#888">col x17</text>
<text x="200" y="678" font-size="12" fill="#888">col x20</text>
<text x="350" y="678" font-size="12" fill="#888">col x23</text>
<text x="560" y="500" font-size="15" font-weight="bold" fill="#333">a word is a melody</text>
<text x="560" y="522" font-size="13" fill="#444">demorini = d(e,o,i,i): "speak: Mercury-Mars-Sun-Sun"</text>
<text x="560" y="540" font-size="13" fill="#444">- the vowel line of EGO EIMI (rounds 44-59)</text>
<text x="560" y="575" font-size="13" fill="#444">verse order: outer pairs first, the centre word commits last</text>
<text x="560" y="593" font-size="13" fill="#444">(ring composition: the mese governs - rounds 52-54)</text>
<text x="560" y="628" font-size="13" fill="#444">digits #0-#e: same grid + marker tone x6 (base 12)</text>
<text x="560" y="646" font-size="13" fill="#444">carrier f0 free; default 154.2 Hz, the ark note (round 56)</text>
<text x="24" y="714" font-size="11" fill="#999">The Sound - KANON v0.1. All claims computable; see WHITEPAPER.md honest-claims table.</text></svg>