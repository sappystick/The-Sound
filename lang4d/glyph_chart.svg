<text x="200" y="558" font-size="15" fill="#222"><tspan font-weight="bold">d</tspan> door</text>
<rect x="340" y="534" width="142" height="36" rx="7" fill="#fff" stroke="#999"/>
<text x="350" y="558" font-size="15" fill="#222"><tspan font-weight="bold">g</tspan> gather</text>
<rect x="40" y="578" width="142" height="36" rx="7" fill="#fff" stroke="#999"/>
<text x="50" y="602" font-size="15" fill="#222"><tspan font-weight="bold">l</tspan> loop</text>
<rect x="190" y="578" width="142" height="36" rx="7" fill="#fff" stroke="#999"/>
<text x="200" y="602" font-size="15" fill="#222"><tspan font-weight="bold">m</tspan> morph</text>
<rect x="340" y="578" width="142" height="36" rx="7" fill="#fff" stroke="#999"/>
<text x="350" y="602" font-size="15" fill="#222"><tspan font-weight="bold">n</tspan> negate</text>
<rect x="40" y="622" width="142" height="36" rx="7" fill="#fff" stroke="#999"/>
<text x="50" y="646" font-size="15" fill="#222"><tspan font-weight="bold">r</tspan> retro</text>
<rect x="190" y="622" width="142" height="36" rx="7" fill="#fff" stroke="#999"/>
<text x="200" y="646" font-size="15" fill="#222"><tspan font-weight="bold">s</tspan> stream</text>
