<text x="360" y="670" font-size="11" fill="#888">Adar</text>
<text x="514" y="470" font-size="12" fill="#888">spring</text>
<text x="514" y="532" font-size="12" fill="#888">summer</text>
<text x="514" y="594" font-size="12" fill="#888">autumn</text>
<text x="514" y="656" font-size="12" fill="#888">winter</text>
<text x="600" y="460" font-size="15" fill="#222">marks (spoken as high tones)</text>
<text x="600" y="488" font-size="13" fill="#333"><tspan font-size="16">|</tspan>   breath: end of verse</text>
<text x="600" y="512" font-size="13" fill="#333"><tspan font-size="16">!</tspan>   urgent: runs before the ring</text>
<text x="600" y="536" font-size="13" fill="#333"><tspan font-size="16">~</tspan>   sandbox: errors become no-ops</text>
<text x="600" y="560" font-size="13" fill="#333"><tspan font-size="16">?</tspan>   guard: runs only if i > 0</text>
<text x="600" y="584" font-size="13" fill="#333"><tspan font-size="16">:</tspan>   :name calls · ::name defines · :: ends</text>
<text x="600" y="608" font-size="13" fill="#333"><tspan font-size="16">#</tspan>   number, base 12</text>
<text x="600" y="632" font-size="13" fill="#333"><tspan font-size="16">=</tspan>   checksum of the verse</text>
<text x="600" y="680" font-size="13" fill="#333">inside a word: syllables compose left to right</text>
<text x="600" y="700" font-size="13" fill="#333">inside a verse: outer pairs first, the centre last</text>
<text x="24" y="744" font-size="11" fill="#999">The Sound · KANON v0.2 · run python3 lang4d/kanon.py selftest</text></svg>