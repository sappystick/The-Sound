<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="Georgia,serif">
<rect width="1000" height="760" fill="#f6f4ef"/>
<text x="24" y="40" font-size="26" fill="#222">KANON v0.2: the calendar palace</text>
<text x="24" y="62" font-size="13" fill="#666">seven vowels = the seven days and planet-strings; twelve consonants = the twelve months and operations; a syllable = one of 84 days</text>
<text x="30" y="110" font-size="22" fill="#b07a2a">i</text>
<text x="62" y="110" font-size="14" fill="#333">Sunday · Sun · ratio 1.0000 · 154.2 Hz · plane: accumulator (the mese)</text>
<text x="30" y="152" font-size="22" fill="#222">a</text>
<text x="62" y="152" font-size="14" fill="#333">Monday · Moon · ratio 1.3333 · 205.6 Hz · plane: input / second argument</text>
<text x="30" y="194" font-size="22" fill="#222">o</text>
<text x="62" y="194" font-size="14" fill="#333">Tuesday · Mars · ratio 0.8889 · 137.1 Hz · plane: output stage</text>
<text x="30" y="236" font-size="22" fill="#222">e</text>
<text x="62" y="236" font-size="14" fill="#333">Wednesday · Mercury · ratio 1.1852 · 182.8 Hz · plane: scratch</text>
<text x="30" y="278" font-size="22" fill="#222">u</text>
<text x="62" y="278" font-size="14" fill="#333">Thursday · Jupiter · ratio 0.7901 · 121.8 Hz · plane: deep store / counter</text>
<text x="30" y="320" font-size="22" fill="#222">y</text>
<text x="62" y="320" font-size="14" fill="#333">Friday · Venus · ratio 1.0535 · 162.4 Hz · plane: pair register</text>
<text x="30" y="362" font-size="22" fill="#222">w</text>
<text x="62" y="362" font-size="14" fill="#333">Saturday · Saturn · ratio 0.7500 · 115.6 Hz · plane: archive (the silent string)</text>
