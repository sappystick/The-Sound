<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680"><rect width="1000" height="680" fill="#fbfaf7"/>
<text x="20" y="32" font-size="20" font-family="sans-serif" font-weight="700" fill="#1d1d1f">The tabernacle read as one instrument (thought experiment)</text>
<text x="20" y="54" font-size="13" font-family="sans-serif" fill="#555">Dimensions from Exodus 25-30 and 1 Kings 6-7 (cubit 0.445 m). Frequencies calculated; roles are speculative.</text>
<rect x="20" y="75" width="960" height="470" fill="#f2efe6" stroke="#b8ae90" stroke-width="2" rx="4"/><text x="28" y="95" font-size="15" font-family="sans-serif" fill="#1d1d1f" font-weight="600">Court 100 x 50 cubits: the baffle</text><text x="28" y="113" font-size="12.5" font-family="sans-serif" fill="#444">base of the harmonic frame: 3.85 Hz; every length dividing 100 cubits is one of its harmonics</text>
<rect x="330" y="150" width="620" height="300" fill="#e9e3d2" stroke="#8c7f5a" stroke-width="2" rx="4"/><text x="338" y="170" font-size="15" font-family="sans-serif" fill="#1d1d1f" font-weight="600">Holy Place 20 x 10 x 10: tuning chamber</text><text x="338" y="188" font-size="12.5" font-family="sans-serif" fill="#444">axes 19.3 / 38.5 / 38.5 Hz (harmonics 5, 10, 10)</text>
<rect x="700" y="200" width="230" height="200" fill="#ddd3b8" stroke="#6b5c33" stroke-width="2" rx="4"/><text x="708" y="220" font-size="15" font-family="sans-serif" fill="#1d1d1f" font-weight="600">Holy of Holies 10-cube</text><text x="708" y="238" font-size="12.5" font-family="sans-serif" fill="#444">38.5 Hz on all 3 axes</text>
<line x1="700" y1="200" x2="700" y2="400" stroke="#7a3b3b" stroke-width="5"/><text x="706" y="420" font-size="12.5" font-family="sans-serif" fill="#7a3b3b">veil (red line): the diaphragm</text>
<rect x="760" y="300" width="110" height="60" fill="#d8b84a" stroke="#7a5c00" stroke-width="2" rx="4"/><text x="768" y="322" font-size="15" font-family="sans-serif" fill="#1d1d1f" font-weight="600">Ark</text><text x="768" y="340" font-size="12.5" font-family="sans-serif" fill="#444">box: 154.2 Hz</text>
<path d="M 760 300 Q 815 245 870 300" fill="none" stroke="#7a5c00" stroke-width="3"/><text x="712" y="376" font-size="12" font-family="sans-serif" fill="#7a5c00">arc = cherubim: the horn / mouth</text>
<text x="712" y="392" font-size="12" font-family="sans-serif" fill="#7a5c00">"from between them I will speak"</text>
<line x1="420" y1="330" x2="420" y2="296" stroke="#b08a1a" stroke-width="2.5"/><circle cx="420" cy="291" r="4" fill="#e3b341"/>
<line x1="442" y1="330" x2="442" y2="284" stroke="#b08a1a" stroke-width="2.5"/><circle cx="442" cy="279" r="4" fill="#e3b341"/>
<line x1="464" y1="330" x2="464" y2="272" stroke="#b08a1a" stroke-width="2.5"/><circle cx="464" cy="267" r="4" fill="#e3b341"/>
<line x1="486" y1="330" x2="486" y2="260" stroke="#b08a1a" stroke-width="4"/><circle cx="486" cy="255" r="4" fill="#e3b341"/>
<line x1="508" y1="330" x2="508" y2="272" stroke="#b08a1a" stroke-width="2.5"/><circle cx="508" cy="267" r="4" fill="#e3b341"/>
<line x1="530" y1="330" x2="530" y2="284" stroke="#b08a1a" stroke-width="2.5"/><circle cx="530" cy="279" r="4" fill="#e3b341"/>
<line x1="552" y1="330" x2="552" y2="296" stroke="#b08a1a" stroke-width="2.5"/><circle cx="552" cy="291" r="4" fill="#e3b341"/>
<text x="400" y="355" font-size="13" font-family="sans-serif" font-weight="600" fill="#1d1d1f">Menorah: 7 voices</text><text x="400" y="372" font-size="12" font-family="sans-serif" fill="#444">heptachord, mese = 154.2 Hz (the ark note)</text>
<rect x="560" y="230" width="120" height="48" fill="#efe2c4" stroke="#8c7f5a" stroke-width="2" rx="4"/><text x="566" y="250" font-size="15" font-family="sans-serif" fill="#1d1d1f" font-weight="600">Table 2 x 1 x 1.5</text><text x="566" y="268" font-size="12.5" font-family="sans-serif" fill="#444">octave, fifth, fourth</text>
<rect x="560" y="385" width="90" height="50" fill="#efe2c4" stroke="#8c7f5a" stroke-width="2" rx="4"/><text x="566" y="405" font-size="15" font-family="sans-serif" fill="#1d1d1f" font-weight="600">Incense</text><text x="566" y="423" font-size="12.5" font-family="sans-serif" fill="#444">the breath</text>
<rect x="105" y="300" width="160" height="70" fill="#c9a27a" stroke="#6d4a26" stroke-width="2" rx="4"/><text x="111" y="322" font-size="15" font-family="sans-serif" fill="#1d1d1f" font-weight="600">Altar 5x5x3</text><text x="111" y="340" font-size="12.5" font-family="sans-serif" fill="#444">the drum: 77 / 129 Hz</text>
<rect x="105" y="160" width="160" height="60" fill="#b9c3c7" stroke="#4d5b60" stroke-width="2" rx="4"/><text x="111" y="182" font-size="15" font-family="sans-serif" fill="#1d1d1f" font-weight="600">Laver / sea</text><text x="111" y="200" font-size="12.5" font-family="sans-serif" fill="#444">the gong (~24 Hz)</text>
<rect x="40" y="470" width="340" height="22" fill="#b8916a" stroke="#6d4a26"/><text x="48" y="486" font-size="12.5" font-family="sans-serif">Jachin: hollow bronze bass tube, struck ~118 Hz</text>
<rect x="40" y="505" width="340" height="22" fill="#b8916a" stroke="#6d4a26"/><text x="48" y="521" font-size="12.5" font-family="sans-serif">Boaz: hollow bronze bass tube, struck ~118 Hz</text>
<text x="20" y="575" font-size="13" font-family="sans-serif" fill="#1d1d1f"><tspan font-weight="600">Worn by the player:</tspan> robe with 72 golden bells (shaker); breastpiece with 12 stones (12 notes).</text><text x="20" y="595" font-size="13" font-family="sans-serif" fill="#1d1d1f"><tspan font-weight="600">Signals:</tspan> two silver trumpets (~0.42 m, partials 408-1225 Hz).</text>
<text x="20" y="615" font-size="13" font-family="sans-serif" fill="#1d1d1f"><tspan font-weight="600">What it makes:</tspan> a walk-in resonator. One voice, sung on the ark note, excites the harmonic series of every chamber</text>
<text x="20" y="635" font-size="13" font-family="sans-serif" fill="#1d1d1f">and seems to come from between the cherubim.</text>
<text x="20" y="655" font-size="11.5" font-family="sans-serif" fill="#777">The Sound, round 56. Speculative mapping; physics from stated dimensions. Not a historical reconstruction.</text></svg>